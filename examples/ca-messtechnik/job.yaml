model: gpt-6.1-sol

reasoning:
  effort: high

# Standard statt Flex: Der letzte Flex-Lauf schlug mit flex_unavailable (429) fehl.
processing:
  mode: standard

task: task.md

template:
  path: template/template.tex

inputs:
  - path: "input/Übungen Einführung Messtechnik.pdf"
    role: recreate
    policy: verbatim

references: []

runtime:
  context_archive: ~/RClone/bleau1975/ChatGPT-Sandbox/context/context-lmtx-ready.tar.xz
  memory_limit: 4g
  keep_remote: false

limits:
  max_agent_turns: 80
  max_nogo_repairs: 4
  timeout_seconds: 3600
  max_output_tokens: 24000

review:
  reproduction: true
  max_content_repairs: 3
  max_visual_repairs: 3
  max_pages: 60
  pages_per_batch: 2
